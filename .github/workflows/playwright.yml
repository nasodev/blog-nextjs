name: PR checks

# main 브랜치 push 는 deploy.yml 의 lint 잡이 동일한 검사를 배포 게이트로 수행한다.
# 이 워크플로는 중복을 피해 PR 만 담당한다.
on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # Dockerfile(node:22-alpine)·deploy.yml 과 일치
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check types and unit regressions
        run: |
          npm run typecheck
          npm run test:unit

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      # 브라우저 스펙은 BLOG_E2E 가 설정돼야 mock API 와 dev 서버가 뜬다.
      # npm run test:e2e 가 그 환경변수와 --project=chromium 을 함께 지정한다.
      - name: Test local blog with mock API
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
