name: Deploy blog-nextjs

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Lint check
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check types and unit regressions
        run: |
          npm run typecheck
          npm run test:unit

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test local blog with mock API
        run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Job 2: Build and push Docker image
  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy to server
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd /home/funq/dev/blog-nextjs

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop pm2 if running (migration from pm2)
            if command -v pm2 &> /dev/null && pm2 describe blog &> /dev/null; then
              pm2 stop blog || true
              pm2 delete blog || true
            fi

            # Stop existing container
            docker compose -f docker-compose.prod.yml down || true

            # Start new container
            docker compose -f docker-compose.prod.yml up -d

            # Wait for health check
            echo "Waiting for service to be healthy..."
            sleep 15

            # Verify deployment
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Deployment successful!"
            else
              echo "Health check failed!"
              docker logs blog --tail 50
              exit 1
            fi

            # Purge the data cache.
            # A fresh container starts from the data baked into the image at build
            # time, so any post published after that build is missing from the home,
            # category and sitemap pages until the "posts" tag is revalidated.
            # The secret is server-only and read from .env.prod; the editor itself
            # authenticates with a Firebase ID token and does not need it.
            SECRET=$(grep '^REVALIDATE_SECRET=' /home/funq/dev/config/blog-nextjs/.env.prod 2>/dev/null | sed 's/^REVALIDATE_SECRET=//' | tr -d '\r\n')
            if [ -n "$SECRET" ]; then
              RV=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                -X POST http://localhost:3000/api/revalidate \
                -H 'Content-Type: application/json' \
                -H "x-revalidate-secret: $SECRET" -d '{}')
              echo "Revalidate after deploy: HTTP $RV"
              [ "$RV" = "200" ] || echo "WARNING: revalidate did not return 200 — new posts may not appear until the next publish"
            else
              echo "Revalidate skipped: REVALIDATE_SECRET is not set in .env.prod"
            fi

            # Clean up old images
            docker image prune -f
